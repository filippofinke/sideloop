<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Sideloop</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Cdefs%3E%3ClinearGradient id='bg' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%235ac8fa'/%3E%3Cstop offset='.55' stop-color='%23007aff'/%3E%3Cstop offset='1' stop-color='%235856d6'/%3E%3C/linearGradient%3E%3ClinearGradient id='gloss' x1='0' y1='0' x2='0' y2='1'%3E%3Cstop offset='0' stop-color='%23fff' stop-opacity='.22'/%3E%3Cstop offset='.5' stop-color='%23fff' stop-opacity='0'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='512' height='512' rx='115' fill='url%28%23bg%29'/%3E%3Crect width='512' height='512' rx='115' fill='url%28%23gloss%29'/%3E%3Cg fill='none' stroke='%23fff' stroke-width='30' stroke-linecap='round'%3E%3Cpath d='M370.3 190A132 132 0 0 0 128 225'/%3E%3Cpath d='M141.7 322A132 132 0 0 0 384 287'/%3E%3C/g%3E%3Cg fill='%23fff' stroke='%23fff' stroke-width='10' stroke-linejoin='round'%3E%3Cpath d='M121 266L99 216L156 226Z'/%3E%3Cpath d='M391 246L413 296L356 286Z'/%3E%3C/g%3E%3Crect x='211' y='176' width='90' height='160' rx='22' fill='%23fff'/%3E%3Crect x='238' y='190' width='36' height='8' rx='4' fill='%23007aff' opacity='.55'/%3E%3Cpath d='M232 262l17 17 32-36' fill='none' stroke='%23007aff' stroke-width='16' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f2f2f7; --cell:#ffffff; --elev:#ffffff;
  --label:#000000; --label-2:rgba(60,60,67,.6); --label-3:rgba(60,60,67,.3);
  --sep:rgba(60,60,67,.29); --fill:rgba(120,120,128,.2); --fill-3:rgba(118,118,128,.12);
  --blue:#007aff; --green:#34c759; --orange:#ff9500; --red:#ff3b30; --gray:#8e8e93;
  --bar:rgba(249,249,249,.8); --scrim:rgba(0,0,0,.4);
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#000000; --cell:#1c1c1e; --elev:#2c2c2e;
  --label:#ffffff; --label-2:rgba(235,235,245,.6); --label-3:rgba(235,235,245,.3);
  --sep:rgba(84,84,88,.6); --fill:rgba(120,120,128,.36); --fill-3:rgba(118,118,128,.24);
  --blue:#0a84ff; --green:#30d158; --orange:#ff9f0a; --red:#ff453a;
  --bar:rgba(22,22,24,.8); --scrim:rgba(0,0,0,.6);
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--label);font:17px/1.29 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;letter-spacing:-.022em;-webkit-font-smoothing:antialiased;min-height:100vh}
button,input,select{font:inherit;color:inherit;letter-spacing:inherit}
.page{max-width:680px;margin:0 auto;padding:0 20px calc(100px + env(safe-area-inset-bottom))}
.hidden{display:none!important}
svg.i{flex:none;display:block}

.navbar{position:sticky;top:0;z-index:10;height:calc(44px + env(safe-area-inset-top));padding-top:env(safe-area-inset-top);display:flex;align-items:center;justify-content:center;transition:background .2s}
.navbar.scrolled{background:var(--bar);backdrop-filter:saturate(1.8) blur(20px);-webkit-backdrop-filter:saturate(1.8) blur(20px);box-shadow:0 .5px 0 var(--sep)}
.navbar .t{font-weight:600;opacity:0;transition:opacity .2s}
.navbar.scrolled .t{opacity:1}
.navbar .r{position:absolute;top:env(safe-area-inset-top);height:44px;display:flex;align-items:center;right:max(12px,calc(50% - 330px))}
.navbtn{border:0;background:none;color:var(--blue);font-size:17px;cursor:pointer;padding:8px}
.large{font-size:34px;font-weight:700;letter-spacing:.012em;line-height:41px;margin:2px 0 16px}

.sect{margin:0 0 32px}
.shead{display:flex;align-items:baseline;justify-content:space-between;margin:0 16px 7px}
.shead h3{font-size:13px;font-weight:400;text-transform:uppercase;color:var(--label-2);margin:0;letter-spacing:-.005em}
.foot{font-size:13px;color:var(--label-2);margin:7px 16px 0;line-height:1.38;letter-spacing:-.005em}
.list{background:var(--cell);border-radius:10px;overflow:hidden}
.cell{position:relative;display:flex;align-items:center;gap:12px;min-height:44px;padding:10px 16px;width:100%;border:0;background:none;text-align:left}
.list>*+*::before{content:"";position:absolute;top:0;right:0;left:16px;height:.5px;background:var(--sep)}
.list>.ind+*::before,.list>*+.ind::before{left:58px}
.list>.approw+*::before{left:84px}
.cell .k{flex:1;min-width:0}
.cell .v{color:var(--label-2);text-align:right}
.cell .sub{display:block;font-size:13px;color:var(--label-2);margin-top:1px;letter-spacing:-.005em}
button.cell{cursor:pointer}
button.cell:active:not(:disabled){background:var(--fill-3)}
.cell.action{color:var(--blue)}
.cell.center{justify-content:center}
.cell:disabled{opacity:.4;cursor:default}
.ico{width:30px;height:30px;border-radius:7px;display:grid;place-items:center;flex:none;color:#fff}
.chev{color:var(--label-3)}
.linkbtn{border:0;background:none;color:var(--blue);font-size:15px;cursor:pointer;padding:0;display:inline-flex;align-items:center;gap:4px}
.linkbtn:disabled{opacity:.4;cursor:default}
.iconbtn{border:0;background:none;color:var(--red);cursor:pointer;padding:6px;margin:-6px;border-radius:8px;display:grid;place-items:center}
.iconbtn.armed{background:var(--red);color:#fff;padding:6px 10px;font-size:13px;font-weight:600;margin:-6px -6px -6px 0}

.appicon{flex:none;display:grid;place-items:center;color:#fff;font-weight:700;letter-spacing:0;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.1)}
.appicon.md{width:56px;height:56px;border-radius:12.6px;font-size:25px}
.appicon.xs{width:30px;height:30px;border-radius:7px;font-size:15px}
.approw{position:relative;display:flex;gap:12px;align-items:center;padding:12px 16px}
.approw .mid{flex:1;min-width:0}
.approw .nm{font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.approw .st{font-size:15px;color:var(--label-2);margin-top:1px}
.st.warn{color:var(--orange)} .st.bad{color:var(--red)}
.meter{position:relative;height:4px;border-radius:2px;background:var(--fill);margin-top:8px;max-width:300px}
.meter>i{position:absolute;inset:0 auto 0 0;border-radius:2px;background:var(--green)}
.meter.warn>i{background:var(--orange)} .meter.bad>i{background:var(--red)}
.cap{border:0;border-radius:999px;padding:6px 16px;font-size:15px;font-weight:700;letter-spacing:-.01em;cursor:pointer;white-space:nowrap;background:var(--fill-3);color:var(--blue);flex:none;display:inline-flex;align-items:center;gap:6px}
.cap.solid{background:var(--blue);color:#fff}
.cap:disabled{opacity:.4;cursor:default}
.cap:active:not(:disabled){opacity:.7}

.badge{display:inline-flex;align-items:center;gap:6px;font-size:15px;color:var(--label-2);white-space:nowrap}
.badge::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--gray)}
.badge.ok::before{background:var(--green)} .badge.warn::before{background:var(--orange)} .badge.bad::before{background:var(--red)}

.banner{display:flex;gap:12px;align-items:flex-start;background:var(--cell);border-radius:10px;padding:12px 16px;margin:0 0 24px;font-size:15px;line-height:1.35}
.banner+.banner{margin-top:-14px}
.banner svg{color:var(--orange)} .banner.bad svg{color:var(--red)}

.switch{position:relative;width:51px;height:31px;flex:none;display:inline-block}
.switch input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:1}
.switch span{position:absolute;inset:0;border-radius:16px;background:var(--fill);transition:background .25s}
.switch span::before{content:"";position:absolute;width:27px;height:27px;left:2px;top:2px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15),0 3px 1px rgba(0,0,0,.06);transition:transform .25s cubic-bezier(.3,.7,.4,1)}
.switch input:checked+span{background:var(--green)}
.switch input:checked+span::before{transform:translateX(20px)}

.cell input.fi,.cell select.fi{flex:1.4;min-width:0;border:0;background:none;text-align:right;color:var(--label-2);padding:0;outline:none;font-size:17px}
.cell input.fi:focus{color:var(--label)}
.cell input.fi::placeholder{color:var(--label-3)}
.cell select.fi{appearance:none;-webkit-appearance:none;cursor:pointer;text-align-last:right}
.cell label{flex:none}

.drop{position:relative;display:flex;align-items:center;gap:12px;padding:10px 16px;min-height:44px;cursor:pointer;color:var(--blue)}
.drop.over{background:var(--fill-3)}
.drop .k{flex:1}
.progress{height:4px;border-radius:2px;background:var(--fill);overflow:hidden;margin:0 16px 12px}
.progress i{display:block;height:100%;background:var(--blue);width:0;transition:width .2s}
.warnrow{color:var(--label);font-size:15px;line-height:1.35}
.warnrow svg{color:var(--orange);align-self:flex-start;margin-top:1px}
.warnrow.bad svg{color:var(--red)}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--bar);backdrop-filter:saturate(1.8) blur(20px);-webkit-backdrop-filter:saturate(1.8) blur(20px);box-shadow:0 -.5px 0 var(--sep);padding-bottom:env(safe-area-inset-bottom)}
.tabbar .in{max-width:480px;margin:0 auto;display:flex;height:50px}
.tabbar button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;font-weight:500;letter-spacing:.01em;color:var(--gray);cursor:pointer;padding-top:3px}
.tabbar button[aria-current=true]{color:var(--blue)}

.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20;display:flex;align-items:flex-end;justify-content:center;animation:fade .25s}
@media (min-width:700px){.scrim{align-items:center}}
.sheet{background:var(--bg);width:min(560px,100%);max-height:88vh;border-radius:13px 13px 0 0;display:flex;flex-direction:column;animation:up .35s cubic-bezier(.2,.8,.2,1);padding-bottom:env(safe-area-inset-bottom)}
@media (min-width:700px){.sheet{border-radius:13px;box-shadow:0 20px 60px rgba(0,0,0,.3)}}
.grabber{width:36px;height:5px;border-radius:3px;background:var(--label-3);margin:6px auto 0}
.sheet .bar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:52px;padding:0 8px}
.sheet .bar .t{font-weight:600;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet .bar .r{justify-self:end} .navbtn.b{font-weight:600}
.sheet .body{overflow:auto;padding:4px 20px 20px}
.state{display:flex;flex-direction:column;align-items:center;text-align:center;padding:8px 0 22px;gap:10px}
.state .glyph{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;color:#fff}
.state .glyph.ok{background:var(--green)} .state .glyph.bad{background:var(--red)}
.state .ttl{font-size:20px;font-weight:600}
.state .msg{font-size:15px;color:var(--label-2);max-width:420px}
.term{margin:12px 0 0;padding:12px 14px;background:var(--cell);border-radius:10px;max-height:260px;overflow:auto;font-family:var(--mono);font-size:12px;line-height:1.5;white-space:pre-wrap;word-break:break-word;letter-spacing:0;color:var(--label-2)}
.otp{display:flex;flex-direction:column;align-items:center;gap:14px;padding:6px 0 22px;text-align:center}
.otp h2{font-size:22px;font-weight:700;margin:0;letter-spacing:.017em}
.otp p{margin:0;color:var(--label-2);font-size:15px;max-width:340px}
.code{font-family:var(--mono);font-size:30px;letter-spacing:.45em;text-align:center;width:10.5ch;padding:10px 0 10px .45em;border-radius:12px;border:0;background:var(--cell);outline:none}
.code:focus{box-shadow:0 0 0 3px color-mix(in srgb,var(--blue) 45%,transparent)}
.btn{border:0;border-radius:12px;padding:14px 20px;font-size:17px;font-weight:600;cursor:pointer;background:var(--blue);color:#fff;width:100%}
.btn:active{opacity:.7}
.spinner{flex:none;animation:s 1s steps(8) infinite}
@keyframes s{to{transform:rotate(360deg)}}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@keyframes fade{from{opacity:0}}

.prog{padding:4px 0 18px}
.sentence{font-size:20px;font-weight:600;text-align:center;margin:6px 0 16px}
.pbar{height:6px;border-radius:3px;background:var(--fill);overflow:hidden}
.pbar i{display:block;height:100%;border-radius:3px;background:var(--blue);transition:width .6s ease}
.pct{font-size:13px;color:var(--label-2);text-align:right;margin:6px 2px 18px;font-variant-numeric:tabular-nums}
.steps .cell{color:var(--label-3)}
.steps .cell.now{color:var(--label)} .steps .cell.now svg{color:var(--label-2)}
.steps .cell.done{color:var(--label)} .steps .cell.done svg{color:var(--green)}
.steps .dot{width:22px;height:22px;display:grid;place-items:center;flex:none}
.steps .dot::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--label-3)}
.list+.list{margin-top:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.chip{border:0;border-radius:999px;padding:4px 10px;font-size:13px;font-weight:500;cursor:pointer;background:var(--fill-3);color:var(--label-2);display:inline-flex;align-items:center;gap:4px;letter-spacing:-.005em}
.chip.on{background:color-mix(in srgb,var(--blue) 16%,transparent);color:var(--blue)}
.appcell{align-items:flex-start}
.toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top));transform:translateX(-50%);z-index:40;background:var(--elev);color:var(--label);padding:12px 20px;border-radius:999px;font-size:15px;font-weight:600;box-shadow:0 8px 30px rgba(0,0,0,.18),0 0 0 .5px var(--sep);animation:drop .35s cubic-bezier(.2,.8,.2,1);max-width:calc(100% - 32px);text-align:center}
@keyframes drop{from{transform:translate(-50%,-30px);opacity:0}}

.auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 20px}
.auth .box{width:min(380px,100%);text-align:center}
.auth .logo{display:block;width:88px;height:88px;margin:0 auto 18px}
.auth h1{font-size:28px;font-weight:700;margin:0 0 6px;letter-spacing:.013em}
.auth p{color:var(--label-2);margin:0 0 24px;font-size:15px}
.auth .list{text-align:left}
.auth .err{color:var(--red);font-size:13px;margin:8px 16px 0;text-align:left}
.auth .btn{margin-top:18px}

.logs{margin:0;padding:14px 16px;font-family:var(--mono);font-size:12px;line-height:1.6;white-space:pre-wrap;word-break:break-word;max-height:calc(100vh - 230px);overflow:auto;letter-spacing:0;color:var(--label-2)}
.empty{text-align:center;padding:36px 20px;color:var(--label-2);font-size:15px}
.empty b{display:block;font-size:20px;color:var(--label);margin:14px 0 6px}
</style>
</head>

  const targets = devs.reduce((n, d) => n + onDev(d).length, 0);

  const section = d => {
    const [cls, label] = devState(d), rows = onDev(d);
    return `<div class="sect">
      <div class="shead"><h3>${esc(d.name)}</h3><span class="badge ${cls}" style="font-size:13px">${label}</span></div>
      <div class="list">${rows.map(({a, t}) => {
        const s = sig(t), lr = t.signature.last_run, failed = lr && lr.result === "fail";
        const pct = t.signature.expiry ? Math.max(0, Math.min(100, s.left / life * 100)) : 0;
        return `<div class="approw">${appIcon(a, "md")}
          <div class="mid"><div class="nm">${esc(a.name)}</div>
            <div class="st ${failed ? "bad" : s.cls}">${failed ? "Last re-sign failed" : s.text}</div>
            ${t.signature.expiry ? `<div class="meter ${s.cls}"><i style="width:${pct}%"></i></div>` : ""}</div>
          <button class="cap ${s.cls === "ok" ? "" : "solid"}" data-sign="${esc(a.id)}" data-dev="${esc(d.udid)}" ${busy ? "disabled" : ""}>${t.signature.expiry ? "Re-sign" : "Install"}</button></div>`;
      }).join("") || `<div class="cell"><span class="k" style="color:var(--label-2)">No apps on this device</span><button class="linkbtn" data-go="settings">Choose</button></div>`}</div>
    </div>`;
  };

  let autoCard = "";
  if (S.watcher.running) {
    const what = auto && auto.app ? esc(auto.app) : "your apps";
    const sentence = auto && auto.stage ? {signin: `Signing in to install ${what}…`, sign: `Signing ${what}…`, send: `Copying ${what} to the device…`, install: `Installing ${what}…`}[auto.stage]
                   : `Checking ${what}…`;
    const p = auto && auto.stage ? Math.round(pct(auto) * 100) : null;
    autoCard = `<div class="banner auto"><span style="color:var(--label-2)">${spinner(20)}</span><div style="flex:1;min-width:0">
      <div>${sentence}</div>${p !== null ? `<div class="pbar" style="margin-top:8px"><i style="width:${p}%"></i></div>` : ""}
      <div class="st" style="font-size:13px;color:var(--label-2);margin-top:4px">Automatic${p !== null ? ` · ${p}%` : ""}. Buttons are paused until it's done.</div></div></div>`;
  }

  return `${autoCard}${issues.map(([k, t]) => `<div class="banner ${k}">${ic(k === "bad" ? "alert-circle" : "warning", 20)}<div>${esc(t)}</div></div>`).join("")}
  ${devs.map(section).join("")}
  <div class="sect">
    <div class="list">
      ${targets > 1 ? `<button class="cell action" id="signall" ${busy ? "disabled" : ""}>${ic("sync", 22)}Re-sign Everything</button>` : ""}
      <button class="cell action" id="recheck" ${busy ? "disabled" : ""}>${ic("refresh", 22)}Check Everything</button>
      <button class="cell action" data-go="settings">${ic("add-circle", 22)}Add App or Device</button>
    </div>
  </div>
  <div class="sect">
    <div class="list"><div class="cell">${tile("var(--green)", "flash")}<span class="k">Re-sign Automatically</span>${sw("auto", c.auto_check)}</div></div>
    <div class="foot">Checks each device when it connects and re-signs ${c.renew_before_days} day${c.renew_before_days > 1 ? "s" : ""} before an app expires.</div>
  </div>`;
}

const STEPS = [["signin", "Sign in to Apple"], ["sign", "Sign app"], ["send", "Copy to device"], ["install", "Install"]];
const SPAN = {signin: [0, .06], sign: [.06, .5], send: [.5, .95], install: [.95, 1]};
const sheetHost = document.body.appendChild(Object.assign(document.createElement("div"), {id: "sheethost"}));
let sheetFor = null;
const patch = (el, html) => { if (el && el._h !== html) { el._h = html; el.innerHTML = html; } };
const pct = j => { const [a, b] = SPAN[j.stage]; return a + (b - a) * (j.stage === "signin" ? 0 : j.fraction); };

function renderSheet() {
  const j = sheetJob();
  if (!j) { if (sheetFor) { sheetHost.innerHTML = ""; sheetFor = null; } return; }
  if (sheetFor !== j.id) {
    sheetFor = j.id;
    sheetHost.innerHTML = `<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true">
      <div class="grabber"></div>
      <div class="bar"><div id="sh-l"></div><div class="t" id="sh-t"></div><div class="r" id="sh-r"></div></div>
      <div class="body"><div id="sh-main"></div>
        <div class="list"><button class="cell action center" id="togglelog"></button></div>
        <pre class="term hidden" id="joblog"></pre></div></div></div>`;
  }
  const lines = jobLines.concat(j.partial ? [j.partial] : []);
  const last = lines.filter(l => l.trim()).slice(-1)[0] || "Starting…";
  const asking = j.running && j.needs_input && j.accepts_input;
  const who = j.app ? esc(j.app) : "the app";
  patch($("#sh-t"), esc(j.title));
  patch($("#sh-l"), j.running ? `<button class="navbtn" id="cancel">Cancel</button>` : "");
  patch($("#sh-r"), j.running ? "" : `<button class="navbtn b" id="dismiss">Done</button>`);

  let mode, main;
  if (asking) { mode = "ask"; main = `<form class="otp" id="askf">
      <div class="appicon md" style="background:linear-gradient(160deg,#8e8e93,#636366)">${ic("lock-closed", 26)}</div>
      <h2>Verification Code</h2><p>Enter the code sent to your Apple devices.</p>
      <input class="code" id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="••••••" autofocus>
      <button class="btn" style="width:min(320px,100%)">Continue</button></form>`; }
  else if (j.running && j.stage) {
    mode = "progress";
    const p = Math.round(pct(j) * 100), at = STEPS.findIndex(([k]) => k === j.stage);
    const sentence = {signin: "Signing in to Apple…", sign: `Signing ${who}…`, send: "Copying to the device…", install: "Installing…"}[j.stage];
    main = `<div class="prog"><div class="sentence">${sentence}</div>
      <div class="pbar"><i style="width:${p}%"></i></div><div class="pct">${p}%</div>
      <div class="list steps">${STEPS.map(([k, l], i) => `<div class="cell ${i < at ? "done" : i === at ? "now" : ""}">
        ${i < at ? ic("checkmark-circle", 22) : i === at ? spinner(20) : `<span class="dot"></span>`}<span class="k">${l}</span></div>`).join("")}</div></div>`;
  }
  else if (j.running) { mode = "spin"; main = `<div class="state"><span style="color:var(--label-2)">${spinner(30)}</span><div class="msg">${esc(last)}</div></div>`; }
  else if (j.rc === 0) { mode = "ok"; main = `<div class="state"><div class="glyph ok">${ic("checkmark", 32)}</div><div class="ttl">Done</div>${j.kind === "refresh" && j.app ? `<div class="msg">${who} is signed and installed.</div>` : ""}</div>`; }
  else { mode = "fail"; main = `<div class="state"><div class="glyph bad">${ic("close", 32)}</div><div class="ttl">Didn't Work</div><div class="msg">${esc(last)}</div></div>`; }

  const box = $("#sh-main");
  if (mode === "progress" && box._mode === "progress") {
    const p = Math.round(pct(j) * 100);
    const tmp = document.createElement("div"); tmp.innerHTML = main;
    box.querySelector(".pbar i").style.width = p + "%";
    box.querySelector(".pct").textContent = p + "%";
    box.querySelector(".sentence").textContent = tmp.querySelector(".sentence").textContent;
    const cur = box.querySelector(".steps");
    if (box._stage !== j.stage) cur.innerHTML = tmp.querySelector(".steps").innerHTML;
  } else if (box._mode !== mode || mode === "spin" || mode === "fail") {
    patch(box, main);
    if (mode === "ask" && box._mode !== "ask") { const c = $("#code"); if (c) c.focus(); }
  }
  box._mode = mode; box._stage = j.stage;

  patch($("#togglelog"), showLog ? "Hide Details" : "Show Details");
  const pre = $("#joblog");
  pre.classList.toggle("hidden", !showLog);
  if (showLog) {
    const text = lines.length ? lines.join("\n") : "starting…";
    if (pre.textContent !== text) { const end = pre.scrollHeight - pre.scrollTop - pre.clientHeight < 30; pre.textContent = text; if (end) pre.scrollTop = pre.scrollHeight; }
  }
}
sheetHost.addEventListener("click", e => {
  const b = e.target.closest("button"), j = S && S.job;
  if (e.target.id === "scrim" && j && !j.running) { dismiss(j.id); renderSheet(); return; }
  if (!b) return;
  if (b.id === "dismiss") { dismiss(j.id); renderSheet(); }
  else if (b.id === "cancel") act(() => api("/api/job/cancel", {json:{}}));
  else if (b.id === "togglelog") { showLog = !showLog; renderSheet(); const pre = $("#joblog"); if (showLog) pre.scrollTop = pre.scrollHeight; }
});
sheetHost.addEventListener("submit", e => {
  e.preventDefault();
  const v = $("#code").value.trim(); if (!v) return;
  act(() => api("/api/job/input", {json:{text:v}}));
});

function settingsView() {
  const c = S.config, apps = S.apps || [], canPair = S.mode === "builtin", devs = S.registered || [];
  const known = new Set(devs.map(d => d.udid.toLowerCase()));
  const visible = (S.devices || []).filter(d => !known.has(d.udid.toLowerCase()));
  const replacing = pending && apps.find(a => a.bundle_id === pending.info.bundle_id);
  const appIds = apps.reduce((n, a) => n + 1 + (+(a.info && a.info.extension_count) || 0), 0);
  const trash = (kind, id, label) => `<button class="iconbtn ${confirmRemove === kind + id ? "armed" : ""}" data-remove="${esc(kind + id)}" aria-label="Remove ${esc(label)}">${confirmRemove === kind + id ? "Remove" : ic("trash-outline", 20)}</button>`;
  return `
  <div class="sect">
    <div class="shead"><h3>Devices</h3></div>
    <div class="list">
      ${devs.map(d => { const [cls, label] = devState(d);
        return `<div class="cell ind">${tile(d.live ? "var(--blue)" : "var(--gray)", devIcon(d))}<span class="k">${esc(d.name)}<span class="sub">${label}</span></span>${trash("dev:", d.udid, d.name)}</div>`; }).join("")}
      ${visible.map(d => `<div class="cell ind">${tile("var(--gray)", devIcon({live:d, name:d.name}))}<span class="k">${esc(d.name)}<span class="sub">${d.reachable ? "Paired, not added" : "Locked"}</span></span>
        <button class="cap solid" data-add="${esc(d.udid)}">Add</button></div>`).join("")}
      ${!devs.length && !visible.length ? `<div class="cell"><span class="k" style="color:var(--label-2)">${S.scanning ? "Looking for devices…" : "No device found"}</span></div>` : ""}
      <button class="cell action" id="scan" ${S.scanning ? "disabled" : ""}>${S.scanning ? "Scanning…" : "Scan Again"}</button>
      ${canPair ? `<button class="cell action" id="pair">Pair New Device…</button>` : ""}
    </div>
    <div class="foot">${canPair ? "To pair, plug the device into this machine and tap Trust. After that it works over Wi‑Fi. " : ""}A new device gets all your apps; change that per app below.</div>
  </div>

  <div class="sect">
    <div class="shead"><h3>Apps</h3></div>
    <div class="list">
      ${apps.map(a => { const on = new Set(a.targets.map(t => t.udid));
        return `<div class="cell ind appcell">${appIcon(a, "xs")}<span class="k">${esc(a.name)}<span class="sub">${esc(a.version)}</span>
          ${devs.length > 1 ? `<span class="chips">${devs.map(d => `<button class="chip ${on.has(d.udid) ? "on" : ""}" data-toggle="${esc(a.id)}" data-dev="${esc(d.udid)}">${on.has(d.udid) ? ic("checkmark", 12) : ""}${esc(d.name)}</button>`).join("")}</span>` : ""}</span>
          ${trash("app:", a.id, a.name)}</div>`; }).join("")}
      ${pending ? `<div class="cell ind">${appIcon(pending.info, "xs")}<span class="k">${esc(pending.info.name)}<span class="sub">${esc(pending.info.version)} · ${esc(pending.filename)}</span></span></div>
        ${ipaWarnings(pending.info)}
        <button class="cell action" id="useipa" style="font-weight:600">${replacing ? `Replace ${esc(replacing.name)}` : devs.length > 1 ? "Add to All Devices" : "Add App"}</button>
        <button class="cell action" id="dropipa" style="color:var(--red)">Cancel</button>`
      : `<div class="drop" id="drop">${ic("add-circle", 22)}<span class="k" id="progt">Add App…</span></div>
         <div class="progress hidden" id="prog"><i></i></div>
         <input type="file" id="file" accept=".ipa" class="hidden">`}
    </div>
    <div class="foot">A free Apple ID allows 3 apps per device and 10 App IDs a week${apps.length ? ` (these use ${appIds}; the same app on more devices costs nothing extra)` : ""}.</div>
  </div>

  <div class="sect">
    <div class="shead"><h3>Apple ID</h3></div>
    <form id="aidf" autocomplete="off"><div class="list">
      <div class="cell"><label for="aid">Email</label><input class="fi" id="aid" type="email" value="${esc(c.apple_id)}" placeholder="name@example.com" required></div>
      <div class="cell"><label for="apw">Password</label><input class="fi" id="apw" type="password" placeholder="${c.has_password ? "Saved" : "Required"}" autocomplete="new-password"></div>
      <button class="cell action">Save</button>
    </div></form>
    <div class="foot">Use the regular password, not an app-specific one.</div>
  </div>

  <div class="sect">
    <div class="shead"><h3>Re-signing</h3></div>
    <div class="list">
      <div class="cell ind">${tile("var(--green)", "flash")}<span class="k">Automatic</span>${sw("auto2", c.auto_check)}</div>
      <div class="cell ind">${tile("var(--orange)", "time-outline")}<label for="rb" class="k">Re-sign Early</label>
        <select class="fi" id="rb">${[1,2,3,4,5,6].map(d => `<option value="${d}" ${d === c.renew_before_days ? "selected" : ""}>${d} day${d > 1 ? "s" : ""}</option>`).join("")}</select>
        <span class="chev">${ic("chevron-forward", 16)}</span></div>
    </div>
  </div>`;
}
function ipaWarnings(i) {
  const row = (bad, t) => `<div class="cell warnrow ${bad ? "bad" : ""}">${ic(bad ? "alert-circle" : "warning", 20)}<span class="k">${t}</span></div>`;
  let w = "";
  if (i.encrypted === "yes") w += row(true, "This IPA is still encrypted and won't launch.");
  if (+i.extension_count) w += row(false, `Uses ${1 + +i.extension_count} App IDs (${i.extension_count} extension${+i.extension_count > 1 ? "s" : ""}).`);
  for (const d of S.registered || []) if (d.live && i.min_ios && parseInt(i.min_ios) > parseInt(d.live.ios)) w += row(false, `Needs iOS ${esc(i.min_ios)}; ${esc(d.name)} has ${esc(d.live.ios)}.`);
  return w;
}

function activityView() {
  return `<div class="sect">
    <div class="shead"><h3>History</h3><button class="linkbtn" id="reload">${ic("refresh", 15)}Reload</button></div>
    <div class="list"><pre class="logs" id="logs">Loading…</pre></div></div>`;
}
async function loadLogs() {
  const r = await api("/api/logs");
  const el = $("#logs"); if (!el) return;
  el.textContent = r.lines.length ? r.lines.join("\n") : "Nothing yet.";
  el.scrollTop = el.scrollHeight;
}

async function act(fn, ok) { try { await fn(); if (ok) toast(ok); } catch (e) { toast(e.message); } await poll(); }
function startJob(path, body={}) { return act(async () => { const r = await api(path, {json: body}); if (r.job) watched.add(r.job); }); }

function wire() {
  const on = (id, ev, fn) => { const el = document.getElementById(id); if (el) el[ev] = fn; };
  root.querySelectorAll("[data-view]").forEach(b => b.onclick = () => go(b.dataset.view));
  root.querySelectorAll("[data-go]").forEach(b => b.onclick = () => go(b.dataset.go));
  root.querySelectorAll("[data-sign]").forEach(b => b.onclick = () => startJob("/api/refresh", {force:true, app:b.dataset.sign, device:b.dataset.dev}));
  root.querySelectorAll("[data-add]").forEach(b => b.onclick = () => act(() => api("/api/device/add", {json:{udid:b.dataset.add}}), "Device added"));
  root.querySelectorAll("[data-toggle]").forEach(b => b.onclick = () => {
    const a = S.apps.find(x => x.id === b.dataset.toggle), on = new Set(a.targets.map(t => t.udid));
    on.has(b.dataset.dev) ? on.delete(b.dataset.dev) : on.add(b.dataset.dev);
    act(() => api("/api/app/devices", {json:{app:a.id, devices:[...on]}}));
  });
  on("signall", "onclick", () => startJob("/api/refresh", {force:true}));
  on("recheck", "onclick", () => startJob("/api/recheck"));
  on("pair", "onclick", () => startJob("/api/pair"));
  on("scan", "onclick", () => act(() => api("/api/devices/scan", {json:{}})));
  on("reload", "onclick", loadLogs);
  for (const id of ["auto", "auto2"]) on(id, "onchange", e => act(() => api("/api/settings", {json:{auto_check:e.target.checked}})));
  on("rb", "onchange", e => act(() => api("/api/settings", {json:{renew_before_days:+e.target.value}}), "Saved"));
  root.querySelectorAll("[data-remove]").forEach(b => b.onclick = () => {
    const id = b.dataset.remove;
    if (confirmRemove !== id) { confirmRemove = id; render(); setTimeout(() => { if (confirmRemove === id) { confirmRemove = null; render(); } }, 4000); return; }
    confirmRemove = null;
    const [kind, key] = [id.slice(0, 4), id.slice(4)];
    act(() => kind === "dev:" ? api("/api/device/remove", {json:{device:key}}) : api("/api/app/remove", {json:{id:key}}), "Removed");
  });
  on("aidf", "onsubmit", e => { e.preventDefault(); act(async () => { await api("/api/appleid", {json:{apple_id:$("#aid").value, password:$("#apw").value}}); $("#apw").value = ""; }, "Saved"); });
  on("useipa", "onclick", () => act(async () => { await api("/api/ipa/use", {json:{filename:pending.filename}}); pending = null; }, "App added"));
  on("dropipa", "onclick", () => { pending = null; render(); });
  const drop = $("#drop"), file = $("#file");
  if (drop && file) {
    drop.onclick = () => file.click();
    file.onchange = () => file.files[0] && upload(file.files[0]);
    drop.ondragover = e => { e.preventDefault(); drop.classList.add("over"); };
    drop.ondragleave = () => drop.classList.remove("over");
    drop.ondrop = e => { e.preventDefault(); drop.classList.remove("over"); const f = e.dataTransfer.files[0]; if (f) upload(f); };
  }
}
function upload(f) {
  if (!/\.ipa$/i.test(f.name)) return toast("That's not an .ipa file");
  clearTimeout(pollT); pollGen++;
  const prog = $("#prog"), bar = $("#prog i"), txt = $("#progt");
  prog.classList.remove("hidden");
  const x = new XMLHttpRequest();
  x.open("PUT", "/api/ipa"); x.setRequestHeader("X-Requested-With", "sideloop");
  x.upload.onprogress = e => { if (e.lengthComputable) { bar.style.width = (e.loaded/e.total*100) + "%"; txt.textContent = `Uploading… ${Math.round(e.loaded/e.total*100)}%`; } };
  x.upload.onload = () => { txt.textContent = "Reading the app…"; };
  x.onload = () => {
    let r = {}; try { r = JSON.parse(x.responseText); } catch {}
    if (x.status === 200) pending = {info: r.info, filename: f.name}; else toast(r.error || `Upload failed (${x.status})`);
    render(); poll();
  };
  x.onerror = () => { toast("Upload failed"); render(); poll(); };
  x.send(f);
}
boot().catch(e => { root.innerHTML = `<div class="auth"><div class="box"><h1>Can't Connect</h1><p>${esc(e.message)}</p></div></div>`; });
</script>
</body>
</html>
