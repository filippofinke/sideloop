name: sideloop


services:
  app:
    build: .
    image: sideloop
    container_name: sideloop
    restart: unless-stopped
    network_mode: host
    privileged: true
    environment:
      MUX: builtin
      # Apple only accepts anisette data from a Mac identity since October 2026.
      ANISETTE_SERVER: ${ANISETTE_SERVER:-https://new.ani.sidestore.io}
      TZ: ${TZ:-UTC}
    volumes:
      - ./data:/data
      - ./data/lockdown:/var/lib/lockdown
      - /run/udev:/run/udev:ro
      - /dev/bus/usb:/dev/bus/usb
